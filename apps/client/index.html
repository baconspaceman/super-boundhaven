<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Super Boundhaven</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%230b0b14'/%3E%3Crect x='1' y='1' width='6' height='6' fill='%23ffd84a'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23ff4f7b'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b12; overflow: hidden; font-family: monospace; }
      canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
      #banner { position: fixed; top: 0; left: 0; right: 0; padding: 8px; text-align: center; background: #b3261e; color: #fff; z-index: 20; display: none; }
      #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 6px 12px; background: #1a1a38; border: 2px solid #ff4f7b; color: #fff; z-index: 30; display: none; font-size: 13px; }
      #hud { position: fixed; top: 4px; left: 4px; margin: 0; padding: 4px 6px; background: rgba(0,0,0,.6); color: #8f8; font-size: 12px; line-height: 1.3; z-index: 5; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="banner">Disconnected - reconnecting...</div>
    <pre id="hud"></pre>
    <div id="toast" role="status"></div>
    <div id="creator"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
